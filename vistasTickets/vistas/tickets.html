<h1>TICKET</h1>

<div class="col-md-3">
    <button id="boton-NuevoTicket" type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#modalTickets">
        Nuevo Ticket
    </button>
</div>



<div class="row">

    <div class="col-md-2 mb-2">
        <label class="control-label">Desde</label>
        <input class="form-control form-control-sm" type="date" id="buscarFechaDesde">
    </div>

    <div class="col-md-2 mb-2">
        <label class="control-label">Hasta</label>
        <input class="form-control form-control-sm" type="date" id="buscarFechaHasta">
    </div>


    <div class="col-md-2 mb-2">
        <label for="ticketFiltroPrioridad" class="control-label">Filtrar por prioridad:</label>
        <select class="form-control form-control-sm" id="ticketFiltroPrioridad">
            <option value="0">[Todas las categorias]</option>
            <option value="1">Baja</option>
            <option value="2">Media</option>
            <option value="3">Alta</option>
        </select>
    </div>

    <div class="col-md-2 mb-2">
        <label for="ticketFiltroEstado" class="control-label">Filtrar por estado:</label>
        <select class="form-control form-control-sm" id="ticketFiltroEstado">
            <option value="0">[Todos los estados]</option>
            <option value="1">Abierto</option>
            <option value="2">En proceso</option>
            <option value="3">Cerrado</option>
            <option value="4">Cancelado</option>
        </select>

    </div>

    <div class="col-md-2 mb-2">
        <label class="control-label">Categoria</label>
        <select class="form-control form-control-sm" id="ticketFiltroCategoria"></select>
    </div>
</div>

<table class="table">
    <thead>
        <tr>
            <th scope="col">Titulo</th>
            <th scope="col">Fecha Creacion</th>
            <th scope="col">Categoria</th>
            <th scope="col">Estado</th>
            <th scope="col">Prioridad</th>
            <th scope="col">Creador</th>
            <!-- <th scope="col">Email</th> -->
            <th scope="col"></th>
            <th scope="col"></th>

        </tr>
    </thead>
    <tbody id="tbody-Tickets">


    </tbody>
</table>





<!-- Modal nuevo ticket-->
<div class="modal fade" id="modalTickets" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    onclick="LimpiarFormularioTicket()"></button>
            </div>
            <div class="modal-body">
                <form class="formCategorias">
                    <input type="" id="ticketid" value="0" />
                    <div class="row">
                        <div class="mb-3 col-6">
                            <label for="tituloTicket" class="form-label">Titulo</label>
                            <input type="text" class="form-control" id="tituloTicket"
                                placeholder="Ingrese el titulo del ticket" style="text-transform: uppercase" />
                        </div>
                        <div class="mb-3 col-6">
                            <label for="categoriasSelect" class="form-label">Categoria</label>
                            <select class="form-select" id="categoriasSelect">
                                <option class="option" value="" disabled selected>
                                    [Seleccione]
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Descripcion" id="floatingTextarea"></textarea>
                        <label for="floatingTextarea">Descripcion</label>
                    </div>

                    <div class="row">
                        <div class="mb-3 col-6">
                            <label for="prioridadTicket" class="form-label">Prioridad</label>
                            <select class="form-select" id="prioridadTicket">
                                <option value="1">Baja</option>
                                <option value="2">Media</option>
                                <option value="3">Alta</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="LimpiarFormularioTicket()">
                    CERRAR
                </button>
                <button type="button" class="btn btn-primary" onclick="NuevoTicket()">
                    GUARDAR
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal editar ticket-->
<div class="modal fade" id="modalEditarTickets" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                    onclick="LimpiarFormularioTicketEditar()"></button>
            </div>
            <div class="modal-body">
                <form class="formCategorias">
                    <input type="" id="ticketidEditar" value="0" />
                    <div class="row">
                        <div class="mb-3 col-6">
                            <label for="tituloTicketEditar" class="form-label">Titulo</label>
                            <input type="text" class="form-control" id="tituloTicketEditar"
                                placeholder="Ingrese el titulo del ticket" style="text-transform: uppercase" />
                        </div>
                        <div class="mb-3 col-6">
                            <label for="categoriasSelectEditar" class="form-label">Categoria</label>
                            <select class="form-select" id="categoriasSelectEditar">
                                <option class="option" value="" disabled selected>
                                    [Seleccione]
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Descripcion" id="floatingTextareaEditar"></textarea>
                        <label for="floatingTextareaEditar">Descripcion</label>
                    </div>

                    <div class="row">
                        <div class="mb-3 col-6">
                            <label for="prioridadTicketEditar" class="form-label">Prioridad</label>
                            <select class="form-select" id="prioridadTicketEditar">
                                <option value="1">Baja</option>
                                <option value="2">Media</option>
                                <option value="3">Alta</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="LimpiarFormularioTicketEditar()">
                    CERRAR
                </button>
                <button type="button" class="btn btn-primary" onclick="EditarTicket()">
                    EDITAR
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal historial -->
<!-- Modal -->
<div class="modal fade" id="modalHistorial" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <table class="table">
                    <thead>
                        <tr>
                            <!-- <th scope="col">Id</th> -->
                            <th scope="col">Campo Modificado</th>
                            <th scope="col">Valor anterior</th>
                            <th scope="col">Valor nuevo</th>
                            <th scope="col">Fecha Modificacion</th>
                            <th scope="col">Modificó</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-Historial">


                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Save changes</button>
            </div>
        </div>
    </div>
</div>
